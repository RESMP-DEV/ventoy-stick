# Provisioning profile: example (placeholder; copy to a real profile via
# tools/make-profile.sh -- never edit this file into a real profile by hand).
#
# Every variable the provisioner and generator understand, with its meaning.
# Values here are inert placeholders.
TARGET_USER="you"                     # login user created by the installer + provisioner
REALNAME="Your Name"                  # gecos / git identity
GIT_EMAIL="you@example.io"            # git identity
HOSTNAME="compute1"                   # machine hostname

# Router listeners (bootstrap.sh installs credentials from secrets.tar,
# then starts these as systemd --user services)
ENABLE_CCR_MAIN=1                     # 127.0.0.1:3456, general provider pool
ENABLE_GLM_WORKERS=1                  # 127.0.0.1:3457, GLM-only worker listener
ENABLE_ZCODE_CREDS=0                  # install ~/.zcode/v2 credentials if bundled

# --- Stand-up layer (full mode only; see BRINGUP.md) ---
ENABLE_PASSWORDLESS_SUDO=1            # /etc/sudoers.d/<user> NOPASSWD fragment,
                                      #   visudo-validated; the autoinstall seed
                                      #   also writes it pre-first-boot
ENABLE_BUILD_CACHE=1                  # sccache/cargo wiring + ccache 50G config
ENABLE_POLICY_FILES=1                 # installs files/AGENTS-core.md as
                                      #   ~/AGENTS.md, ~/.codex/AGENTS.md, and
                                      #   the ~/.claude/CLAUDE.md @~/AGENTS.md stub
ENABLE_CLAUDE=1                       # Claude Code + claude-ccr launcher +
                                      #   ~/.claude/settings.json routing + smoke
CLAUDE_MODEL_TIER="zai,glm-5.3[1m]"   # tier model ids routed through ccr-main
                                      #   (the [1m] suffix unlocks the 1M window)

ENABLE_NVIDIA=0                       # NVIDIA driver from the Ubuntu repo
NVIDIA_DRIVER_PKG="nvidia-driver-595-open"   # -open modules: Secure Boot off
ENABLE_CUDA=0                         # nvidia-cuda-toolkit (several minutes)
ENABLE_ZEROTIER=0                     # zerotier-one + join (Central auth is manual)
ZT_NETWORK_ID=""                      # 16-hex-char ZeroTier network id

# Initial console password (crypted into the generated autoinstall seed);
# real profiles keep this secret-adjacent and the seed is gitignored.
INITIAL_PASSWORD="change-me"
